<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG Jessica Garcia | Catálogo Directo</title>
    
    <!-- Motores Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animaciones de Interfaz */
        .cluster-hover { transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .cluster-hover:hover { transform: scale(1.05); }
        .product-lift { transition: all 0.3s ease; }
        .product-lift:hover { transform: translateY(-5px); }

        .active-link::after {
            content: '';
            display: block;
            width: 100%;
            height: 2px;
            background: #f59e0b;
            margin-top: 4px;
        }
    </style>
</head>
<body class="bg-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente de Iconos SVG Nativos - Corregido para evitar SyntaxError (Adjacent JSX elements)
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Menu: <path d="M3 12h18M3 6h18M3 18h18" />,
                Bag: (
                    <g>
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                        <path d="M3 6h18"/>
                        <path d="M16 10a4 4 0 0 1-8 0"/>
                    </g>
                ),
                Search: (
                    <g>
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </g>
                ),
                Arrow: (
                    <g>
                        <path d="M5 12h14"/>
                        <path d="M12 5l7 7-7 7"/>
                    </g>
                ),
                Star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
                Truck: (
                    <g>
                        <path d="M10 17h4V5H2v12h3m15 0h2v-3.34a1.72 1.72 0 0 0-.44-1.17l-2.92-3.07a1.72 1.72 0 0 0-1.24-.42H14v12h3"/>
                        <circle cx="7.5" cy="17.5" r="2.5"/>
                        <circle cx="17.5" cy="17.5" r="2.5"/>
                    </g>
                ),
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                Shield: (
                    <g>
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
                        <path d="m9 12 2 2 4-4"/>
                    </g>
                )
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 10);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Clusters de Categoría - Selección instantánea
            const categories = [
                { id: 1, name: 'Bikinis Cristal', img: 'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=400' },
                { id: 2, name: 'Bañadores NPC', img: 'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=400' },
                { id: 3, name: 'Leggings', img: 'https://images.unsplash.com/photo-1550345332-09e3ac987658?q=80&w=400' },
                { id: 4, name: 'Tops & Bra', img: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=400' },
                { id: 5, name: 'Batas Pro', img: 'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=400' },
                { id: 6, name: 'Classic Physique', img: 'https://images.unsplash.com/photo-1594381898411-846e7d193883?q=80&w=400' },
            ];

            const products = [
                { id: 101, name: 'Bikini Emerald Shine Pro', price: '189.00€', tag: 'Top Ventas', img: 'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=600' },
                { id: 102, name: 'Legging Supplex Black', price: '48.50€', tag: 'Nuevo', img: 'https://images.unsplash.com/photo-1550345332-09e3ac987658?q=80&w=600' },
                { id: 103, name: 'Top Militar Seamless', price: '35.00€', tag: null, img: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=600' },
                { id: 104, name: 'Bañador NPC Velvet Red', price: '41.90€', tag: 'Agotándose', img: 'https://images.unsplash.com/photo-1594381898411-846e7d193883?q=80&w=600' },
            ];

            return (
                <div className="min-h-screen">
                    
                    {/* 1. NAVEGACIÓN QUIRÚRGICA - ELIMINADO OFERTAS Y TALLAS */}
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${isScrolled ? 'bg-white py-3 shadow-md border-b' : 'bg-white py-5'}`}>
                        <div className="max-w-[1400px] mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-8">
                                <Icon name="Menu" className="md:hidden cursor-pointer" />
                                <div className="hidden md:flex gap-10 text-[10px] font-bold uppercase tracking-[0.25em] text-slate-400">
                                    <a href="#" className="hover:text-black transition-colors">Novedades</a>
                                    <a href="#" className="hover:text-black transition-colors">Competición</a>
                                    <a href="#" className="text-black border-b border-black pb-1">Ropa Deportiva</a>
                                    <a href="#" className="hover:text-black transition-colors">Taller JG</a>
                                </div>
                            </div>
                            
                            <div className="text-2xl font-[900] tracking-tighter italic absolute left-1/2 -translate-x-1/2 md:static md:translate-x-0">
                                JG<span className="text-amber-600">.</span>GARCIA
                            </div>

                            <div className="flex items-center gap-6">
                                <Icon name="Search" className="text-slate-300 hover:text-black cursor-pointer" />
                                <div className="relative cursor-pointer group">
                                    <Icon name="Bag" className="group-hover:text-amber-600 transition-colors" />
                                    <span className="absolute -top-2 -right-2 bg-black text-white text-[8px] font-black px-1.5 py-0.5 rounded-full">0</span>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="pt-[80px]">
                        
                        {/* 2. HERO DE IMPACTO DIRECTO */}
                        <section className="relative h-[40vh] sm:h-[45vh] bg-slate-900 overflow-hidden flex items-center justify-center">
                            <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=2000" className="absolute inset-0 w-full h-full object-cover opacity-60 scale-105" alt="Hero" />
                            <div className="relative z-10 text-center px-4">
                                <h1 className="text-white text-4xl sm:text-7xl font-[900] uppercase italic tracking-tighter mb-4 leading-none">
                                    Viste para <span className="text-amber-500 underline decoration-1 underline-offset-8">Ganar</span>
                                </h1>
                                <p className="text-slate-300 text-[10px] sm:text-xs font-bold uppercase tracking-[0.4em] mb-8">Diseño de competición y alto rendimiento</p>
                                <button className="bg-white text-black px-10 py-3.5 font-black uppercase text-[10px] tracking-[0.3em] hover:bg-amber-600 hover:text-white transition-all shadow-2xl">
                                    Ver Todo el Catálogo
                                </button>
                            </div>
                        </section>

                        {/* 3. CLUSTERS VISUALES - El usuario identifica el inventario al instante */}
                        <section className="py-14 bg-white border-b overflow-hidden">
                            <div className="max-w-[1400px] mx-auto px-6 text-center">
                                <h2 className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 mb-10">Categorías Principales</h2>
                                <div className="grid grid-cols-3 md:grid-cols-6 gap-6 sm:gap-10">
                                    {categories.map(cat => (
                                        <div key={cat.id} className="group cursor-pointer flex flex-col items-center">
                                            <div className="relative aspect-square w-full max-w-[120px] rounded-full overflow-hidden mb-4 shadow-xl border-2 border-transparent group-hover:border-amber-500 cluster-hover">
                                                <img src={cat.img} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" alt={cat.name} />
                                            </div>
                                            <h3 className="text-[9px] font-black uppercase tracking-widest text-center leading-tight text-slate-500 group-hover:text-black transition-colors">{cat.name}</h3>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* 4. PRODUCT GRID - Transacción Directa */}
                        <section className="py-20 bg-slate-50">
                            <div className="max-w-[1400px] mx-auto px-6">
                                <div className="flex justify-between items-end mb-12 text-center sm:text-left">
                                    <div>
                                        <h2 className="text-2xl font-[900] italic uppercase tracking-tighter">Más Vendidos</h2>
                                        <div className="w-10 h-1 bg-amber-500 mt-2 mx-auto sm:mx-0" />
                                    </div>
                                    <a href="#" className="hidden sm:flex text-[10px] font-black uppercase tracking-widest items-center gap-2 text-slate-400 hover:text-black transition-all border-b border-transparent hover:border-black pb-1">
                                        Ver Colección Completa <Icon name="Arrow" size={14} />
                                    </a>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
                                    {products.map(prod => (
                                        <div key={prod.id} className="group flex flex-col cursor-pointer bg-white p-2 rounded shadow-sm product-lift">
                                            <div className="relative aspect-[3/4] bg-slate-100 overflow-hidden mb-5">
                                                <img src={prod.img} className="w-full h-full object-cover" alt={prod.name} />
                                                {prod.tag && (
                                                    <span className="absolute top-2 left-2 bg-black text-white text-[8px] font-black uppercase tracking-widest px-2 py-1">
                                                        {prod.tag}
                                                    </span>
                                                )}
                                                <div className="absolute inset-x-0 bottom-0 p-3 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                                                    <button className="w-full bg-white/95 backdrop-blur-md text-black py-3 text-[9px] font-black uppercase tracking-widest border border-slate-200 shadow-xl hover:bg-black hover:text-white transition-colors">
                                                        Seleccionar Talla
                                                    </button>
                                                </div>
                                            </div>
                                            <h4 className="text-[11px] font-bold tracking-tight mb-2 uppercase text-slate-600 group-hover:text-black px-1">{prod.name}</h4>
                                            <div className="flex justify-between items-center px-1 border-t border-slate-100 pt-3">
                                                <p className="text-slate-900 text-sm font-[900]">{prod.price}</p>
                                                <div className="flex text-amber-400 gap-0.5">
                                                    <Icon name="Star" size={10} />
                                                    <Icon name="Star" size={10} />
                                                    <Icon name="Star" size={10} />
                                                    <Icon name="Star" size={10} />
                                                    <Icon name="Star" size={10} />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* 5. TRUST BAR - Resolviendo objeciones */}
                        <section className="bg-white py-12 border-y">
                            <div className="max-w-[1400px] mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-10 text-center">
                                <div className="flex flex-col items-center">
                                    <Icon name="Truck" size={24} className="text-amber-600 mb-3" />
                                    <p className="text-[10px] font-black uppercase tracking-[0.2em]">Envío Gratis +200€</p>
                                </div>
                                <div className="flex flex-col items-center border-y md:border-y-0 md:border-x border-slate-100 py-8 md:py-0">
                                    <Icon name="Zap" size={24} className="text-amber-600 mb-3" />
                                    <p className="text-[10px] font-black uppercase tracking-[0.2em]">Taller en España</p>
                                </div>
                                <div className="flex flex-col items-center">
                                    <Icon name="Shield" size={24} className="text-amber-600 mb-3" />
                                    <p className="text-[10px] font-black uppercase tracking-[0.2em]">Garantía Pro-IFBB</p>
                                </div>
                            </div>
                        </section>
                    </main>

                    {/* 6. FOOTER - Aquí viven las utilidades técnicas */}
                    <footer className="bg-slate-900 text-white pt-20 pb-10 px-6">
                        <div className="max-w-[1400px] mx-auto grid grid-cols-1 md:grid-cols-4 gap-16 mb-20 text-center md:text-left">
                            <div className="col-span-1">
                                <div className="text-2xl font-[900] italic mb-6 tracking-tighter uppercase">JG<span className="text-amber-500">.</span>GARCIA</div>
                                <p className="text-slate-400 text-[10px] uppercase tracking-widest leading-relaxed max-w-[250px] mx-auto md:mx-0">
                                    Elite performance attire for world-class athletes. Designed and handmade in Spain.
                                </p>
                            </div>
                            <div>
                                <h5 className="text-[11px] font-black uppercase tracking-[0.3em] mb-8 text-amber-500">Catálogo</h5>
                                <ul className="text-[10px] space-y-4 font-bold text-slate-300 uppercase tracking-widest">
                                    <li className="hover:text-amber-500 cursor-pointer">Bikinis</li>
                                    <li className="hover:text-amber-500 cursor-pointer">Bañadores</li>
                                    <li className="hover:text-amber-500 cursor-pointer">Sportswear</li>
                                </ul>
                            </div>
                            <div>
                                <h5 className="text-[11px] font-black uppercase tracking-[0.3em] mb-8 text-amber-500">Soporte</h5>
                                <ul className="text-[10px] space-y-4 font-bold text-slate-300 uppercase tracking-widest text-white underline underline-offset-4">
                                    <li className="hover:text-amber-500 cursor-pointer">Guía de Tallas</li>
                                    <li className="hover:text-amber-500 cursor-pointer">Contacto Directo</li>
                                    <li className="hover:text-amber-500 cursor-pointer">Envíos</li>
                                </ul>
                            </div>
                            <div>
                                <h5 className="text-[11px] font-black uppercase tracking-[0.3em] mb-8 text-amber-500">Unirse</h5>
                                <div className="flex border-b border-slate-700 pb-2">
                                    <input type="email" placeholder="EMAIL" className="bg-transparent border-none text-[10px] w-full focus:outline-none font-bold text-white" />
                                    <button className="text-[10px] font-black hover:text-amber-500">JOIN</button>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-[1400px] mx-auto pt-8 border-t border-slate-800 flex flex-col md:flex-row justify-between items-center gap-8 text-[9px] font-bold text-slate-600 uppercase tracking-[0.3em]">
                            <p>© 2026 JG Jessica Garcia. Crafted for Glory.</p>
                            <div className="flex gap-8">
                                <span className="hover:text-white cursor-pointer">Instagram</span>
                                <span className="hover:text-white cursor-pointer">TikTok</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
